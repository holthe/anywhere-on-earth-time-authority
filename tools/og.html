<!DOCTYPE html>
<!--
  Source for /og.png (1200x630). Rendered by `make og`.

<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #072b4a;
    background-image: radial-gradient(60% 95% at 50% 0%, rgba(247,241,227,.14), transparent 72%);
    color: #fff;
    font-family: Georgia, serif;
    display: flex; flex-direction: column; text-align: center;
  }
  .mid {
    flex: 1;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    padding: 0 80px;
  }
  .lbl {
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 16px; letter-spacing: 0.26em; text-transform: uppercase;
    color: #9dbdda; font-weight: 600;
  }
  .clock {
    font-family: "Liberation Mono", Menlo, Consolas, monospace;
    font-size: 172px; font-weight: 500; letter-spacing: 0.01em;
    margin-top: 12px; color: #f7f1e3; font-variant-numeric: tabular-nums;
    text-shadow: 0 0 46px rgba(247,241,227,.20);
  }
  h1 { font-family: Georgia, serif; font-size: 42px; font-weight: 400; margin-top: 14px; }
  .sub {
    margin-top: 12px; font-style: italic; font-size: 22px; color: #a7c3dc;
  }
  .foot {
    flex: none;
    padding: 0 72px 28px;
    display: flex; justify-content: space-between;
    font-family: "Helvetica Neue", Arial, sans-serif;
    font-size: 17px; color: #9dbdda;
    text-transform: uppercase; letter-spacing: 0.14em;
  }
</style>
</head>
<body>
  <div class="mid">
    <div class="lbl">Official Anywhere on Earth time &#183; UTC-12</div>
    <div class="clock">23:59:59</div>
    <h1>The Anywhere on Earth Time Authority</h1>
    <p class="sub">Baker &amp; Howland Islands &#183; Where every day ends last</p>
  </div>
  <div class="foot">
    <span>DOC: BEI-AOE</span>
    <span>AOE.BESTEFFORTINDUSTRIES.COM</span>
    <span>The day isn't over until we say so</span>
  </div>
</body>
</html>
